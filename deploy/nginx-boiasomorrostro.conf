# Boia Somorrostro (SIO ICM-CSIC): the web app, plus boia_server.py (systemd unit boiasomorrostro)
# The former iot-dashboard site is kept, unpublished, in /etc/nginx/sites-available/iot-dashboard

server {
    listen 80;
    server_name iot.icm.csic.es iot.cmima.csic.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name iot.icm.csic.es iot.cmima.csic.es;

    ssl_certificate /etc/letsencrypt/live/iot.cmima.csic.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.cmima.csic.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/boiasomorrostro-access.log;
    error_log /var/log/nginx/boiasomorrostro-error.log;

    location = / {
        return 302 /boiasomorrostro/;
    }

    # The app (its paths start with /boiasomorrostro/)
    location ^~ /boiasomorrostro/ {
        alias /var/www/boiasomorrostro/;
        index index.html;
        location ~* \.(glb|png|jpg|jpeg|webp|woff2?|ttf|ico|svg|ktx2|bin)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # AIS ships and patís, a WebSocket
    location = /ais {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # ERDDAP proxy
    location /proxy/ {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Patí positions from the Traccar Client app
    location /pati {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
    }
}
