# Boia Somorrostro (SIO ICM-CSIC): the web app, plus boia_server.py (systemd unit boiasomorrostro)
# The former iot-dashboard site is kept, unpublished, in /etc/nginx/sites-available/iot-dashboard

server {
    listen 80;
    server_name iot.icm.csic.es iot.cmima.csic.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name iot.icm.csic.es iot.cmima.csic.es;

    ssl_certificate /etc/letsencrypt/live/iot.cmima.csic.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.cmima.csic.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/boiasomorrostro-access.log;
    error_log /var/log/nginx/boiasomorrostro-error.log;

    location = / {
        return 302 /boiasomorrostro/;
    }

    # The app's page, checked again on every visit (see below)
    location = /boiasomorrostro/ {
        root /var/www;
        try_files /boiasomorrostro/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # The app (its paths start with /boiasomorrostro/)
    location ^~ /boiasomorrostro/ {
        alias /var/www/boiasomorrostro/;
        index index.html;
        # The code is checked again on every visit (only downloaded if it changed), so a new
        # version shows at once; images, 3D models and fonts are kept for 7 days
        location ~* \.(html|js|mjs|vue|css|json)$ {
            add_header Cache-Control "no-cache";
        }
        location ~* \.(glb|png|jpg|jpeg|webp|woff2?|ttf|ico|svg|ktx2|bin|mp4)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # The buoy's AIS files, written by boia_server.py from the database when a CSV is uploaded on the
    # intranet (BUOY_DATA_DIR, see buoy_ais.py), in place of the copies in git
    location ^~ /boiasomorrostro/data/StaticData/buoy_ {
        alias /opt/boiasomorrostro/buoy_data/buoy_;
        add_header Cache-Control "no-cache";
    }

    # The intranet: not linked from the app, behind a login (users in the htpasswd file)
    location ^~ /boiasomorrostro/intranet/ {
        auth_basic "Intranet Boia Somorrostro";
        auth_basic_user_file /etc/nginx/boiasomorrostro-intranet.htpasswd;
        alias /var/www/boiasomorrostro/intranet/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    location ^~ /boiasomorrostro/intranet/api/ {
        auth_basic "Intranet Boia Somorrostro";
        auth_basic_user_file /etc/nginx/boiasomorrostro-intranet.htpasswd;
        proxy_pass http://127.0.0.1:8767/intranet/api/;
        proxy_set_header Host $host;
        # Who logged in: boia_server.py only answers with it
        proxy_set_header X-Intranet-User $remote_user;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }

    # AIS ships and patís, a WebSocket
    location = /ais {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # ERDDAP proxy
    location /proxy/ {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Intranet-User "";
        proxy_read_timeout 60s;
    }

    # Where our equipment was (the 3D view's history mode), read only
    location /history/ {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Intranet-User "";
    }

    # Patí positions from the Traccar Client app
    location /pati {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Intranet-User "";
    }
}
